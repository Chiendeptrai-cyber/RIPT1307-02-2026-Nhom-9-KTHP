      start_period: 10s

  # ─── Express API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: equipment_api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: equipment_mgmt
      DB_USER: postgres
      DB_PASSWORD: postgres
      # JWT – CHANGE THIS IN PRODUCTION!
      JWT_SECRET: super_secret_jwt_key_change_me_in_production
      JWT_EXPIRES_IN: 8h
      # CORS – allow web container (port 8080 khi chạy Docker, 8000 khi dev local)
      CORS_ORIGIN: "http://localhost:8080,http://localhost:8000"
      # Email (optional – leave blank to disable)
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "lambao2108@gmail.com"
      SMTP_PASS: "bvfqwlsfpufcvzch"
      SMTP_FROM: "PTIT Equipment Management <lambao2108@gmail.com>"
      # Uploads
      UPLOAD_DIR: /app/uploads
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "4000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ─── UmiJS / React Frontend (nginx) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: equipment_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
